name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Audit dependencies
        # yarn audit exit bits: 2 low, 4 moderate, 8 high, 16 critical. deepmerge
        # (low, build-time, via workbox-build) has no patched release, so fail on
        # moderate and above only.
        run: yarn audit || test $? -lt 4
